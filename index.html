<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <h2 class="my-4">Cadastro</h2>
                <form>
                    <label for="nome" class="form-label">Seu nome:</label>
                    <input id="nome" type="text" class="form-control form-control-lg">

                    <label for="email" class="form-label">Seu e-mail:</label>
                    <input id="email" type="email" class="form-control">

                    <label for="telefone" class="form-label">Seu telefone:</label>
                    <input id="telefone" type="tel" class="form-control">

                    <button class="btn btn-primary mt-4">Enviar cadastro</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
